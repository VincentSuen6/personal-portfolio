<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vincent — void://blueteam</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --base: #1e1e2e;
    --mantle: #181825;
    --crust: #11111b;
    --surface0: #313244;
    --surface1: #45475a;
    --surface2: #585b70;
    --overlay0: #6c7086;
    --overlay1: #7f849c;
    --text: #cdd6f4;
    --subtext0: #a6adc8;
    --subtext1: #bac2de;
    --lavender: #b4befe;
    --blue: #89b4fa;
    --sapphire: #74c7ec;
    --sky: #89dceb;
    --teal: #94e2d5;
    --green: #a6e3a1;
    --yellow: #f9e2af;
    --peach: #fab387;
    --maroon: #eba0ac;
    --red: #f38ba8;
    --mauve: #cba6f7;
    --pink: #f5c2e7;
    --flamingo: #f2cdcd;
  }

  /* HACK MODE overrides */
  body.hacked {
    --blue: #ff4444;
    --sapphire: #ff3333;
    --sky: #ff5555;
    --teal: #ff4444;
    --green: #ff6666;
    --mauve: #ff3333;
    --text: #ffcccc;
    --subtext0: #ff9999;
    --subtext1: #ffbbbb;
    --lavender: #ff4444;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'JetBrains Mono', monospace;
    background: var(--crust);
    color: var(--text);
    height: 100vh;
    width: 100vw;
    overflow: hidden;
    position: relative;
    transition: color 0.4s;
  }

  /* WALLPAPER */
  #wallpaper {
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse at 20% 50%, rgba(137,180,250,0.08) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 20%, rgba(203,166,247,0.08) 0%, transparent 50%),
      radial-gradient(ellipse at 60% 80%, rgba(166,227,161,0.06) 0%, transparent 50%),
      linear-gradient(135deg, #0a0a0f 0%, #11111b 40%, #0d0d1a 100%);
    z-index: 0;
    transition: background 0.6s;
  }
  body.hacked #wallpaper {
    background:
      radial-gradient(ellipse at 20% 50%, rgba(255,50,50,0.12) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 20%, rgba(200,0,0,0.10) 0%, transparent 50%),
      radial-gradient(ellipse at 60% 80%, rgba(255,0,0,0.08) 0%, transparent 50%),
      linear-gradient(135deg, #0f0000 0%, #1a0000 40%, #0d0005 100%);
  }

  #wallpaper::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(255,255,255,0.008) 2px, rgba(255,255,255,0.008) 4px);
    pointer-events: none;
  }
  #wallpaper::after {
    content: '';
    position: absolute;
    inset: 0;
    background-image: radial-gradient(circle, rgba(137,180,250,0.15) 1px, transparent 1px);
    background-size: 40px 40px;
    opacity: 0.3;
    transition: opacity 0.4s;
  }
  body.hacked #wallpaper::after {
    background-image: radial-gradient(circle, rgba(255,50,50,0.2) 1px, transparent 1px);
    opacity: 0.4;
  }

  /* TERMINAL WINDOW */
  #terminal-window {
    position: fixed;
    transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    z-index: 100;
    display: flex;
    flex-direction: column;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.08);
    box-shadow:
      0 0 0 1px rgba(137,180,250,0.05),
      0 25px 60px rgba(0,0,0,0.8),
      0 0 80px rgba(137,180,250,0.05),
      inset 0 1px 0 rgba(255,255,255,0.05);
    background: rgba(30,30,46,0.92);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    overflow: hidden;
  }
  body.hacked #terminal-window {
    border-color: rgba(255,50,50,0.3);
    box-shadow:
      0 0 0 1px rgba(255,50,50,0.1),
      0 25px 60px rgba(0,0,0,0.8),
      0 0 80px rgba(255,0,0,0.15),
      inset 0 1px 0 rgba(255,50,50,0.1);
  }

  #terminal-window.fullscreen { inset: 20px; max-height: calc(100vh - 40px); }
  #terminal-window.minimized { bottom: 20px; left: 20px; width: 420px; height: 280px; inset: unset; }

  #terminal-window.overlay {
    position: fixed;
    bottom: 24px;
    left: 50%;
    top: unset;
    width: min(720px, calc(100vw - 48px));
    height: 360px;
    transform: translateX(-50%);
    z-index: 150;
    display: flex;
    flex-direction: column;
    animation: slideUp 0.25s cubic-bezier(0.4, 0, 0.2, 1) forwards;
  }
  @keyframes slideUp {
    from { opacity: 0; transform: translateX(-50%) translateY(16px); }
    to   { opacity: 1; transform: translateX(-50%) translateY(0); }
  }

  #terminal-window.hidden {
    opacity: 0 !important;
    pointer-events: none !important;
    transform: translateX(-50%) translateY(8px) scale(0.97) !important;
  }
  #terminal-window.fullscreen .dot { opacity: 0.3; pointer-events: none; cursor: default; }

  #title-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 16px;
    background: rgba(17,17,27,0.6);
    border-bottom: 1px solid rgba(255,255,255,0.05);
    flex-shrink: 0;
    transition: background 0.4s;
  }
  body.hacked #title-bar { background: rgba(30,0,0,0.7); border-bottom-color: rgba(255,50,50,0.2); }

  .dot { width: 12px; height: 12px; border-radius: 50%; cursor: pointer; transition: opacity 0.2s; }
  .dot:hover { opacity: 0.7; }
  .dot-red    { background: #ff5f57; }
  .dot-yellow { background: #ffbd2e; }
  .dot-green  { background: #28c840; }

  #title-text {
    margin-left: 12px;
    font-size: 12px;
    color: var(--overlay0);
    font-weight: 500;
    letter-spacing: 0.05em;
  }

  #terminal-body {
    flex: 1 1 0;
    min-height: 0;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 16px;
    font-size: 13px;
    line-height: 1.6;
    scrollbar-width: thin;
    scrollbar-color: var(--surface1) transparent;
  }
  #terminal-body::-webkit-scrollbar { width: 4px; }
  #terminal-body::-webkit-scrollbar-thumb { background: var(--surface1); border-radius: 2px; }

  .line { margin-bottom: 2px; white-space: pre-wrap; word-break: break-all; }
  .line-success { color: var(--green); }
  .line-error   { color: var(--red); }
  .line-warning { color: var(--yellow); }
  .line-info    { color: var(--blue); }
  .line-muted   { color: var(--overlay0); }
  .line-mauve   { color: var(--mauve); }
  .line-peach   { color: var(--peach); }
  .line-sky     { color: var(--sky); }
  .line-teal    { color: var(--teal); }
  .line-red     { color: var(--red); }
  .line-prompt  { color: var(--text); }

  /* HACK-specific line colours */
  .line-hack-alert { color: #ff2222; font-weight: 600; }
  .line-hack-ok    { color: #ff6666; }
  .line-hack-sys   { color: #ffaa44; }

  #input-area {
    display: flex;
    align-items: center;
    padding: 8px 16px 14px;
    gap: 0;
    flex-shrink: 0;
  }
  #prompt-label {
    color: var(--mauve);
    font-weight: 600;
    font-size: 13px;
    white-space: nowrap;
    flex-shrink: 0;
  }
  #cmd-input {
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    flex: 1;
    caret-color: var(--green);
    margin-left: 8px;
  }
  body.hacked #cmd-input { caret-color: #ff4444; }

  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
  .cursor { display:inline-block;width:8px;height:14px;background:var(--green);animation:blink 1s step-end infinite;vertical-align:middle;margin-left:1px; }

  /* PROJECT VIEWER */
  #project-viewer {
    position: fixed;
    inset: 0;
    z-index: 50;
    display: none;
    padding: 40px;
    overflow-y: auto;
    background: rgba(11,11,17,0.7);
    backdrop-filter: blur(4px);
    opacity: 0;
    transition: opacity 0.4s ease;
  }
  #project-viewer.visible { display: flex; align-items: flex-start; justify-content: center; }
  #project-viewer.faded-in { opacity: 1; }
  #project-content { max-width: 800px; width: 100%; padding-bottom: 160px; }

  .project-header { margin-bottom: 32px; }
  .project-tag {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 16px;
    margin-right: 8px;
  }
  .tag-red    { background: rgba(243,139,168,0.15); color: var(--red);    border: 1px solid rgba(243,139,168,0.3); }
  .tag-blue   { background: rgba(137,180,250,0.15); color: var(--blue);   border: 1px solid rgba(137,180,250,0.3); }
  .tag-green  { background: rgba(166,227,161,0.15); color: var(--green);  border: 1px solid rgba(166,227,161,0.3); }
  .tag-mauve  { background: rgba(203,166,247,0.15); color: var(--mauve);  border: 1px solid rgba(203,166,247,0.3); }
  .tag-peach  { background: rgba(250,179,135,0.15); color: var(--peach);  border: 1px solid rgba(250,179,135,0.3); }
  .tag-teal   { background: rgba(148,226,213,0.15); color: var(--teal);   border: 1px solid rgba(148,226,213,0.3); }
  .tag-yellow { background: rgba(249,226,175,0.15); color: var(--yellow); border: 1px solid rgba(249,226,175,0.3); }

  .project-title    { font-size: 42px; font-weight: 700; color: var(--text); line-height: 1.1; margin-bottom: 8px; letter-spacing: -0.02em; }
  .project-subtitle { font-size: 15px; color: var(--subtext0); margin-bottom: 32px; line-height: 1.7; }

  .divider { height: 1px; background: linear-gradient(90deg, var(--surface1), transparent); margin: 24px 0; }

  .section-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.15em; color: var(--overlay0); margin-bottom: 12px; font-weight: 600; }
  .project-desc  { font-size: 14px; color: var(--subtext1); line-height: 1.8; margin-bottom: 24px; }

  .tech-stack { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 32px; }
  .tech-pill {
    padding: 5px 14px; border-radius: 20px; font-size: 12px; font-weight: 500;
    background: var(--surface0); color: var(--subtext1); border: 1px solid var(--surface1);
    transition: all 0.2s;
  }
  .tech-pill:hover { background: var(--surface1); color: var(--text); border-color: var(--overlay0); }

  .feature-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 32px; }
  .feature-card { background: var(--surface0); border: 1px solid var(--surface1); border-radius: 8px; padding: 16px; }
  .feature-card h4 { font-size: 12px; color: var(--mauve); margin-bottom: 6px; font-weight: 600; }
  .feature-card p  { font-size: 12px; color: var(--subtext0); line-height: 1.6; }

  .stat-row { display: flex; gap: 24px; margin-bottom: 24px; }
  .stat { text-align: center; }
  .stat-number { font-size: 28px; font-weight: 700; color: var(--blue); display: block; }
  .stat-label  { font-size: 11px; color: var(--overlay0); text-transform: uppercase; letter-spacing: 0.1em; }

  .exit-hint { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--overlay0); margin-top: 8px; }
  .exit-hint kbd {
    background: var(--surface0); border: 1px solid var(--surface1);
    padding: 2px 8px; border-radius: 4px; color: var(--subtext0);
    font-family: 'JetBrains Mono', monospace; font-size: 11px;
  }

  /* SKILL BARS */
  .skill-row { display: flex; align-items: center; gap: 14px; margin-bottom: 10px; }
  .skill-name { width: 160px; font-size: 12px; color: var(--subtext1); flex-shrink: 0; }
  .skill-bar  { flex: 1; height: 3px; background: var(--surface0); border-radius: 2px; overflow: hidden; }
  .skill-fill { height: 100%; background: var(--blue); border-radius: 2px; transition: width 0.8s ease; }
  .skill-pct  { width: 36px; text-align: right; font-size: 11px; color: var(--overlay0); }

  /* SCANLINE */
  @keyframes scanline { 0% { transform: translateY(-100%); } 100% { transform: translateY(100vh); } }
  .scanline {
    position: fixed; top: 0; left: 0; right: 0; height: 2px;
    background: linear-gradient(transparent, rgba(166,227,161,0.06), transparent);
    animation: scanline 8s linear infinite;
    pointer-events: none; z-index: 200;
    transition: background 0.5s;
  }
  body.hacked .scanline {
    background: linear-gradient(transparent, rgba(255,50,50,0.15), transparent);
    animation: scanline 2s linear infinite;
  }

  /* HACK GLITCH */
  @keyframes glitch {
    0%   { clip-path: inset(0 0 98% 0); transform: translateX(-6px) skewX(-4deg); }
    15%  { clip-path: inset(15% 0 70% 0); transform: translateX(6px); }
    30%  { clip-path: inset(50% 0 30% 0); transform: translateX(-4px); }
    50%  { clip-path: inset(75% 0 5% 0);  transform: translateX(5px) skewX(3deg); }
    100% { clip-path: inset(0); transform: none; }
  }
  @keyframes flicker {
    0%,100%{opacity:1} 88%{opacity:1} 89%{opacity:0.2} 90%{opacity:1} 95%{opacity:0.6} 96%{opacity:1}
  }
  body.hacked { animation: flicker 4s infinite; }

  /* LS GRID */
  .ls-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 4px; }
  .ls-dir  { color: var(--blue); font-weight: 600; }
  .ls-file { color: var(--text); }

  /* HELP TABLE */
  .help-table { width: 100%; border-collapse: collapse; }
  .help-table td { padding: 3px 12px 3px 0; font-size: 13px; }
  .help-table td:first-child { color: var(--green); min-width: 160px; }
  .help-table td:last-child  { color: var(--subtext0); }

  /* ASCII */
  .ascii-art { color: var(--blue); font-size: 11px; line-height: 1.2; white-space: pre; }

  /* FAB */
  #terminal-fab {
    display: none;
    position: fixed;
    bottom: 28px;
    right: 28px;
    z-index: 200;
    align-items: center;
    gap: 10px;
    background: rgba(30,30,46,0.95);
    border: 1px solid rgba(203,166,247,0.35);
    border-radius: 40px;
    padding: 10px 18px 10px 14px;
    cursor: pointer;
    box-shadow: 0 4px 24px rgba(0,0,0,0.6), 0 0 0 1px rgba(203,166,247,0.1), 0 0 20px rgba(203,166,247,0.12);
    backdrop-filter: blur(12px);
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    font-weight: 600;
    color: var(--mauve);
    letter-spacing: 0.04em;
    transition: all 0.2s ease;
    animation: fabPop 0.3s cubic-bezier(0.175,0.885,0.32,1.275) forwards;
  }
  @keyframes fabPop { from{opacity:0;transform:scale(0.8) translateY(8px)} to{opacity:1;transform:scale(1) translateY(0)} }
  #terminal-fab:hover { background: rgba(40,40,60,0.98); border-color: rgba(203,166,247,0.6); transform: translateY(-1px); }
  body.hacked #terminal-fab { border-color: rgba(255,50,50,0.5); color: #ff4444; box-shadow: 0 4px 24px rgba(0,0,0,0.6), 0 0 20px rgba(255,0,0,0.2); }

  #project-viewer::-webkit-scrollbar { width: 4px; }
  #project-viewer::-webkit-scrollbar-thumb { background: var(--surface1); border-radius: 2px; }

  @media (max-width: 640px) {
    #terminal-window.fullscreen { inset: 0; border-radius: 0; }
    #project-viewer { padding: 20px; }
    .project-title { font-size: 28px; }
    .feature-grid  { grid-template-columns: 1fr; }
    #terminal-fab  { bottom: 20px; right: 20px; }
    #terminal-window.overlay { width: calc(100vw - 32px); height: 280px; bottom: 16px; }
  }
</style>
</head>
<body>

<div id="wallpaper"></div>
<div class="scanline"></div>

<div id="project-viewer">
  <div id="project-content"></div>
</div>

<div id="terminal-window" class="fullscreen">
  <div id="title-bar">
    <div class="dot dot-red"    onclick="closeTerm()"></div>
    <div class="dot dot-yellow" onclick="minimizeTerm()"></div>
    <div class="dot dot-green"  onclick="maximizeTerm()"></div>
    <span id="title-text">vincent@blueteam: ~</span>
  </div>
  <div id="terminal-body"></div>
  <div id="input-area">
    <span id="prompt-label">
      <span style="color:var(--mauve);font-weight:700">vincent</span><span style="color:var(--overlay1)">@</span><span style="color:var(--blue)">blueteam</span> <span id="path-display" style="color:var(--teal)">~</span><span style="color:var(--green)"> $ </span>
    </span>
    <input type="text" id="cmd-input" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" disabled>
  </div>
</div>

<div id="terminal-fab" onclick="toggleTerminalFab()">
  <span style="font-size:14px;opacity:0.9">&gt;_</span>
  <span>terminal</span>
  <span style="font-size:10px;color:var(--overlay0);font-weight:400;margin-left:4px">` or click</span>
</div>

<script>
// ============================================================
// DATA
// ============================================================

const GHOST_ART = `
    ██████
   ██    ██
  ██  ██  ██
  ██  ██  ██
   ██████████
    █ ████ █
    █      █`;

const FILE_SYSTEM = {
  '~': {
    type: 'dir',
    children: {

      'projects': {
        type: 'dir',
        children: {

          'honeypot-network': {
            type: 'file',
            data: {
              title: 'Honeypot Network',
              subtitle: 'Multi-node deception infrastructure for capturing real attacker TTPs',
              tags: [{ label: 'Python', cls: 'tag-peach' }, { label: 'Docker', cls: 'tag-blue' }, { label: 'Threat Intel', cls: 'tag-teal' }],
              description: `A multi-node honeypot infrastructure built to capture and analyze real-world attacker behaviour. Distributed across several decoy services — SSH, HTTP, FTP, and SMB — the network logged over 2,000 unique attack sessions over its first month of operation.

All data was fed into a custom ELK stack for visualization and pattern analysis. Sessions were correlated by source IP, attack vector, and command sequence to surface recurring TTPs and automated scanning patterns.

The most valuable insight was mapping attacker dwell time and pivot behaviour — watching how actors move from initial access attempts to lateral probing when they think they've found a foothold.`,
              tech: ['T-Pot', 'ELK Stack', 'Python', 'Docker', 'Suricata', 'iptables'],
              features: [
                { title: '// Deception Layer', desc: 'SSH, HTTP, FTP, and SMB honeypots deployed across multiple decoy nodes — mimicking real services' },
                { title: '// ELK Dashboards', desc: 'Custom Kibana dashboards for session correlation, IP geolocation, and TTP mapping' },
                { title: '// TTP Capture', desc: '2,000+ unique attack sessions logged — lateral movement and persistence attempts recorded' },
                { title: '// Alerting Pipeline', desc: 'Real-time alerts on novel attack signatures piped to SIEM for analyst review' }
              ],
              stats: [{ n: '2000+', l: 'Sessions' }, { n: '4', l: 'Protocols' }, { n: 'Live', l: 'Status' }],
            }
          },

          'siem-detection-rules': {
            type: 'file',
            data: {
              title: 'SIEM Detection Rules',
              subtitle: '40+ custom Splunk detection rules — 60% false positive reduction via behavioral baselining',
              tags: [{ label: 'Splunk', cls: 'tag-mauve' }, { label: 'Sigma', cls: 'tag-blue' }, { label: 'ATT&CK', cls: 'tag-green' }],
              description: `Authored and tuned a library of 40+ detection rules for a Splunk SIEM environment. The project started as a false-positive reduction exercise — the existing ruleset was generating enough noise to bury real alerts in the queue.

The approach was behavioral baselining: establish what "normal" looks like per-user and per-host over a rolling 30-day window, then trigger only on statistically significant deviations. Rules were mapped to MITRE ATT&CK techniques to ensure coverage was systematic rather than reactive.

End result: 60% reduction in false positives. P1 mean time to acknowledge dropped from 18 minutes to under 4.`,
              tech: ['Splunk SPL', 'Python', 'Sigma Rules', 'MITRE ATT&CK', 'Behavioral Analysis'],
              features: [
                { title: '// Behavioral Baseline', desc: 'Rolling 30-day user and host baselines — deviations trigger, not static thresholds' },
                { title: '// ATT&CK Mapped', desc: 'Every rule tagged to a MITRE technique — coverage gaps surfaced and prioritized' },
                { title: '// 60% FP Reduction', desc: 'Alert queue noise cut by 60% — P1 MTTA dropped from 18 min to under 4 min' },
                { title: '// Sigma Export', desc: 'Rules exported in Sigma format for portability across SIEM platforms' }
              ],
              stats: [{ n: '40+', l: 'Rules' }, { n: '60%', l: 'FP Reduction' }, { n: '<4min', l: 'P1 MTTA' }],
            }
          },

          'phishing-triage-tool': {
            type: 'file',
            data: {
              title: 'Phishing Triage Tool',
              subtitle: 'Automated phishing email analysis pipeline with VirusTotal enrichment',
              tags: [{ label: 'Python', cls: 'tag-peach' }, { label: 'VirusTotal', cls: 'tag-red' }, { label: 'IR', cls: 'tag-blue' }],
              description: `An automated triage pipeline for phishing reports submitted to the SOC inbox. Before this, analysts were manually parsing email headers, extracting URLs, and running VirusTotal checks one-by-one — a slow process that created a backlog during phishing campaigns.

The tool ingests raw .eml files, extracts headers, sender reputation metadata, embedded URLs, and attachment hashes. Each IOC is automatically enriched via the VirusTotal API and scored. The output is a structured triage report — verdict, confidence score, and recommended action — generated in under 30 seconds per email.

During a simulated spear-phishing campaign test, the tool correctly flagged 97% of malicious samples and cut analyst triage time by 80%.`,
              tech: ['Python', 'VirusTotal API', 'SMTP / MIME parsing', 'IOC extraction', 'Pandas'],
              features: [
                { title: '// Header Analysis', desc: 'Full SMTP header parsing — SPF, DKIM, DMARC checks, relay chain reconstruction' },
                { title: '// IOC Extraction', desc: 'URLs, domains, hashes, and IPs automatically extracted and deobfuscated' },
                { title: '// VT Enrichment', desc: 'All IOCs checked against VirusTotal API — community scores and detections surfaced' },
                { title: '// Triage Report', desc: 'Structured verdict report generated in <30s — verdict, confidence score, action recommendation' }
              ],
              stats: [{ n: '97%', l: 'Detection Rate' }, { n: '80%', l: 'Time Saved' }, { n: '<30s', l: 'Per Email' }],

function getDirAtPath(path) {
  let node = FILE_SYSTEM['~'];
  if (path.length === 1) return node.children;
  for (let i = 1; i < path.length; i++) {
    if (node.children?.[path[i]]) node = node.children[path[i]];
    else return null;
  }
  return node.children || null;
}

// COMMANDS
// ============================================================

const ALL_CMDS = ['ls','cd','cat','whoami','sudo','clear','help','pwd','uname','exit','echo','man','hack'];

function levenshtein(a,b){
  const m=a.length,n=b.length,dp=Array.from({length:m+1},(_,i)=>[i,...Array(n).fill(0)]);
  for(let j=0;j<=n;j++)dp[0][j]=j;
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)dp[i][j]=a[i-1]===b[j-1]?dp[i-1][j-1]:1+Math.min(dp[i-1][j],dp[i][j-1],dp[i-1][j-1]);
  return dp[m][n];
}
function closest(cmd) {
  let best=null,bd=Infinity;
  for(const c of ALL_CMDS){const d=levenshtein(cmd,c);if(d<bd){bd=d;best=c;}}
  return bd<=3?best:null;
}

function handleCommand(raw) {
  if (hackBusy) return;
  const trimmed = raw.trim();
  if (!trimmed) return;
  appendPromptLine(trimmed);
  cmdHistory.unshift(trimmed);
  historyIdx = -1;
  const parts = trimmed.split(/\s+/);
  const cmd   = parts[0].toLowerCase();
  const args  = parts.slice(1);

  switch(cmd) {
    case 'help':   cmdHelp();              break;
    case 'ls':     cmdLs();               break;
    case 'pwd':    appendLine(getPathStr(),'line-teal'); break;
    case 'cd':     cmdCd(args[0]);        break;
    case 'cat':    cmdCat(args[0]);       break;
    case 'clear':  body.innerHTML='';     break;
    case 'whoami': appendLine('vincent — blue team analyst', 'line-success'); break;
    case 'uname':  appendLine('Linux blueteam 6.1.0-blueteam-custom #1 SMP x86_64 GNU/Linux','line-info'); break;
    case 'echo':   appendLine(args.join(' ')); break;
    case 'sudo':   appendLine('sudo: permission denied — SOC policy restricts privilege escalation from this shell.','line-error'); break;
    case 'man':    if(!args[0]){appendLine('What manual page do you want?','line-warning');break;} appendLine(`No manual entry for ${args[0]}. Try 'help'.`,'line-error'); break;
    case 'exit':   viewMode ? exitViewMode() : appendLine('Cannot exit: this terminal is your life now.','line-warning'); break;
    case 'hack':   runHack(); break;
    default: {
      const s = closest(cmd);
      if(s) appendHTML(`<span style="color:var(--red)">bash: ${escHtml(cmd)}: command not found.</span> <span style="color:var(--overlay0)">Did you mean </span><span style="color:var(--yellow)">${s}</span><span style="color:var(--overlay0)">?</span>`);
      else appendLine(`bash: ${cmd}: command not found`,'line-error');
    }
  }
  appendLine('');
  body.scrollTop = body.scrollHeight;
}

function cmdHelp() {
  appendLine('');
  appendLine('Available commands:','line-info');
  appendLine('');
  const cmds = [
    ['ls','list directory contents'],
    ['cd [dir]','change directory (cd .. to go up)'],
    ['cat [file]','open and display a file'],
    ['pwd','print working directory'],
    ['whoami','print current user'],
    ['uname','print system information'],
    ['sudo [cmd]','run as superuser (lol)'],
    ['echo [text]','print text to terminal'],
    ['clear','clear terminal screen'],
    ['help','show this help text'],
    ['exit','exit view mode'],
  ];
  const table = document.createElement('table');
  table.className = 'help-table';
  cmds.forEach(([c,d]) => {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${c}</td><td>${d}</td>`;
    table.appendChild(tr);
  });
  const wrap = document.createElement('div');
  wrap.className = 'line';
  wrap.appendChild(table);
  body.appendChild(wrap);
}

function cmdLs() {
  const dir = getDirAtPath(currentPath);
  if(!dir){appendLine('ls: cannot access directory','line-error');return;}
  const entries = Object.keys(dir);
  if(!entries.length){appendLine('(empty)','line-muted');return;}
  const wrap = document.createElement('div');
  wrap.className = 'line ls-grid';
  entries.forEach(name => {
    const span = document.createElement('span');
    const node = dir[name];
    span.className = node.type==='dir' ? 'ls-dir' : 'ls-file';
    span.textContent = node.type==='dir' ? name+'/' : name;
    wrap.appendChild(span);
  });
  body.appendChild(wrap);
}

function cmdCd(target) {
  if(!target||target==='~'){currentPath=['~'];updatePrompt();return;}
  const segs = target.split('/').filter(s=>s!=='');
  let newPath = target.startsWith('~') ? ['~'] : [...currentPath];
  for(const seg of segs) {
    if(seg==='~'){newPath=['~'];}
    else if(seg==='..'){if(newPath.length>1)newPath.pop();else{appendLine('Already at root.','line-warning');return;}}
    else if(seg==='.'){/* stay */}
    else {
      const dir=getDirAtPath(newPath);
      if(!dir||!dir[seg]){appendLine(`cd: ${seg}: No such file or directory`,'line-error');return;}
      if(dir[seg].type!=='dir'){appendLine(`cd: ${seg}: Not a directory`,'line-error');return;}
      newPath.push(seg);
    }
  }
  currentPath=newPath;updatePrompt();
}

function cmdCat(filename) {
  if(!filename){appendLine('Usage: cat [filename]','line-warning');return;}
  const dir=getDirAtPath(currentPath);
  if(!dir){appendLine(`cat: ${filename}: No such file or directory`,'line-error');return;}
  const node=dir[filename];
  if(!node){appendLine(`cat: ${filename}: No such file or directory`,'line-error');return;}
  if(node.type==='dir'){appendLine(`cat: ${filename}: Is a directory`,'line-error');return;}
  appendLine(`Opening ${filename}...`,'line-muted');
  setTimeout(()=>enterViewMode(node.data),300);
}

// ============================================================
// VIEW MODE
// ============================================================

function enterViewMode(data) {
  viewMode=true;
  const viewer  =document.getElementById('project-viewer');
  const content =document.getElementById('project-content');
  content.innerHTML=buildHTML(data);
  viewer.style.display='flex';
  requestAnimationFrame(()=>viewer.classList.add('faded-in'));
  const term=document.getElementById('terminal-window');
  term.classList.remove('fullscreen','minimized','overlay');
  term.classList.add('hidden');
  termVisible=false;
  input.disabled=true;input.value='';input.blur();
  document.getElementById('terminal-fab').style.display='flex';
}

function exitViewMode() {
  viewMode=false;
  const viewer=document.getElementById('project-viewer');
  viewer.classList.remove('faded-in');
  setTimeout(()=>{viewer.style.display='none';},400);
  const term=document.getElementById('terminal-window');
  term.classList.remove('hidden','minimized','overlay');
  term.classList.add('fullscreen');
  termVisible=true;
  input.disabled=false;
  document.getElementById('terminal-fab').style.display='none';
  appendLine('Exited view mode.','line-muted');
  appendLine('');
  input.focus();
}

  const tags  = d.tags.map(t=>`<span class="project-tag ${t.cls}">${t.label}</span>`).join('');
  const feats = d.features.map(f=>`<div class="feature-card"><h4>${f.title}</h4><p>${f.desc}</p></div>`).join('');
  const tech  = d.tech.map(t=>`<span class="tech-pill">${t}</span>`).join('');
  const stats = d.stats.map(s=>`<div class="stat"><span class="stat-number">${s.n}</span><span class="stat-label">${s.l}</span></div>`).join('');

  return `
    <div class="project-header">
      <div>${tags}</div>
      <h1 class="project-title">${d.title}</h1>
      <p class="project-subtitle">${d.subtitle}</p>
      <div class="exit-hint">

}

// ============================================================
// TERMINAL CONTROLS
// ============================================================

function closeTerm() {
  const t=document.getElementById('terminal-window');
  t.classList.add('hidden');termVisible=false;
  input.disabled=true;input.value='';input.blur();
}
function minimizeTerm() { if(viewMode) toggleTerminalFab(); }
function maximizeTerm() {
  const t=document.getElementById('terminal-window');
  t.classList.remove('minimized','hidden');t.classList.add('fullscreen');
  termVisible=true;input.disabled=false;
  if(viewMode)exitViewMode();input.focus();
}

let termVisible=true;
function toggleTerminalFab() {
  const term=document.getElementById('terminal-window');
  termVisible=!termVisible;
  if(termVisible) {
    input.disabled=false;
    term.classList.remove('fullscreen','minimized');
    term.classList.add('overlay');
    void term.offsetWidth;
    term.classList.remove('hidden');
    setTimeout(()=>{
      body.scrollTop=body.scrollHeight;
      if(body.innerHTML===''){currentPath=['~'];updatePrompt();runBoot();}
      else input.focus();
    },50);
  } else {
    input.disabled=true;input.value='';input.blur();
    term.classList.add('hidden');
  }
}

// ============================================================
// INPUT HANDLING
// ============================================================

input.addEventListener('keydown', e => {
  if(!termVisible||input.disabled){e.preventDefault();return;}
  if(e.key==='Enter'){const v=input.value;input.value='';handleCommand(v);}
  else if(e.key==='ArrowUp'){e.preventDefault();if(historyIdx<cmdHistory.length-1){historyIdx++;input.value=cmdHistory[historyIdx];setTimeout(()=>{input.selectionStart=input.selectionEnd=input.value.length;},0);}}
  else if(e.key==='ArrowDown'){e.preventDefault();if(historyIdx>0){historyIdx--;input.value=cmdHistory[historyIdx];}else{historyIdx=-1;input.value='';}}
  else if(e.key==='Tab'){e.preventDefault();autocomplete();}
  else if(e.key==='l'&&e.ctrlKey){e.preventDefault();body.innerHTML='';}
  else if(e.key==='c'&&e.ctrlKey){e.preventDefault();appendPromptLine(input.value+'^C');input.value='';appendLine('');}
});

function autocomplete() {
  const val=input.value,parts=val.trim().split(/\s+/);
  if(parts.length===1){
    const partial=parts[0];
    const matches=ALL_CMDS.filter(c=>c.startsWith(partial));
    if(matches.length===1)input.value=matches[0]+' ';
    else if(matches.length>1){appendPromptLine(val);appendLine(matches.join('  '),'line-muted');}
  } else if(parts.length===2){
    const partial=parts[1],dir=getDirAtPath(currentPath);
    if(!dir)return;
    const matches=Object.keys(dir).filter(k=>k.startsWith(partial));
    if(matches.length===1)input.value=parts[0]+' '+matches[0];
    else if(matches.length>1){appendPromptLine(val);appendLine(matches.join('  '),'line-muted');}
  }
}

document.addEventListener('click',()=>{if(termVisible&&!input.disabled)input.focus();});
document.addEventListener('keydown',e=>{
  if(e.key==='`'&&viewMode){e.preventDefault();toggleTerminalFab();return;}
  if(!termVisible)return;
  if(e.target!==input&&!e.ctrlKey&&!e.metaKey&&e.key.length===1)input.focus();
});

runBoot();
