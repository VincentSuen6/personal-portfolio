<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<style>
  :root {
    --base: #1e1e2e;
    --mantle: #181825;
    --crust: #11111b;
    --surface0: #313244;
    --surface1: #45475a;
    --surface2: #585b70;
    --overlay0: #6c7086;
    --overlay1: #7f849c;
    --text: #cdd6f4;
    --subtext0: #a6adc8;
    --subtext1: #bac2de;
    --lavender: #b4befe;
    --blue: #89b4fa;
    --sapphire: #74c7ec;
    --sky: #89dceb;
    --teal: #94e2d5;
    --green: #a6e3a1;
    --yellow: #f9e2af;
    --peach: #fab387;
    --maroon: #eba0ac;
    --red: #f38ba8;
    --mauve: #cba6f7;
    --pink: #f5c2e7;
  }

  body.hacked {
    --blue: #ff4040;
    --sapphire: #ff2222;
    --sky: #ff5555;
    --teal: #ff3333;
    --green: #ff5555;
    --mauve: #ff2222;
    --text: #ffcccc;
    --subtext0: #ff9999;
    --subtext1: #ffbbbb;
    --lavender: #ff3333;
    --peach: #ff8800;
  }

  *,*::before,*::after { margin:0; padding:0; box-sizing:border-box; }

  body {
    font-family: 'JetBrains Mono', monospace;
    background: var(--crust);
    color: var(--text);
    height: 100vh;
    width: 100vw;
    overflow: hidden;
    position: relative;
    transition: color 0.5s;
  }

  /* WALLPAPER */
  #wallpaper {
    position: fixed; inset: 0; z-index: 0;
    background:
      radial-gradient(ellipse at 20% 50%, rgba(137,180,250,0.08) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 20%, rgba(203,166,247,0.08) 0%, transparent 50%),
      radial-gradient(ellipse at 60% 80%, rgba(148,226,213,0.06) 0%, transparent 50%),
      linear-gradient(135deg, #0a0a0f 0%, #11111b 40%, #0d0d1a 100%);
    transition: background 0.8s;
  }
  body.hacked #wallpaper {
    background:
      radial-gradient(ellipse at 20% 50%, rgba(255,40,40,0.14) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 20%, rgba(180,0,0,0.10) 0%, transparent 50%),
      radial-gradient(ellipse at 60% 80%, rgba(255,0,0,0.08) 0%, transparent 50%),
      linear-gradient(135deg, #0f0000 0%, #1a0000 40%, #0d0005 100%);
  }
  #wallpaper::before {
    content:''; position:absolute; inset:0; pointer-events:none;
    background-image: repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(255,255,255,0.008) 2px,rgba(255,255,255,0.008) 4px);
  }
  #wallpaper::after {
    content:''; position:absolute; inset:0;
    background-image: radial-gradient(circle, rgba(137,180,250,0.15) 1px, transparent 1px);
    background-size: 40px 40px; opacity: 0.3; transition: opacity 0.5s;
  }
  body.hacked #wallpaper::after {
    background-image: radial-gradient(circle, rgba(255,50,50,0.22) 1px, transparent 1px);
    opacity: 0.45;
  }

  /* SCANLINE */
  @keyframes scanline { 0%{transform:translateY(-100%)} 100%{transform:translateY(100vh)} }
  .scanline {
    position:fixed; top:0; left:0; right:0; height:2px; pointer-events:none; z-index:200;
    background: linear-gradient(transparent, rgba(148,226,213,0.07), transparent);
    animation: scanline 8s linear infinite; transition: background 0.5s;
  }
  body.hacked .scanline {
    background: linear-gradient(transparent, rgba(255,50,50,0.18), transparent);
    animation: scanline 1.8s linear infinite;
  }

  /* TERMINAL WINDOW */
  #terminal-window {
    position:fixed; z-index:100;
    display:flex; flex-direction:column;
    border-radius:12px;
    border: 1px solid rgba(255,255,255,0.08);
    box-shadow: 0 0 0 1px rgba(137,180,250,0.05), 0 25px 60px rgba(0,0,0,0.8), 0 0 80px rgba(137,180,250,0.05), inset 0 1px 0 rgba(255,255,255,0.05);
    background: rgba(30,30,46,0.93);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    overflow: hidden;
    transition: all 0.5s cubic-bezier(0.4,0,0.2,1), border-color 0.4s, box-shadow 0.4s;
  }
  body.hacked #terminal-window {
    border-color: rgba(255,50,50,0.35);
    box-shadow: 0 0 0 1px rgba(255,50,50,0.1), 0 25px 60px rgba(0,0,0,0.85), 0 0 100px rgba(255,0,0,0.18), inset 0 1px 0 rgba(255,50,50,0.08);
  }
  #terminal-window.fullscreen { inset:20px; max-height:calc(100vh - 40px); }
  #terminal-window.minimized  { bottom:20px; left:20px; width:420px; height:280px; inset:unset; }
  #terminal-window.overlay {
    position:fixed; bottom:24px; left:50%; top:unset;
    width:min(760px,calc(100vw - 48px)); height:380px;
    transform:translateX(-50%); z-index:150;
    display:flex; flex-direction:column;
    animation:slideUp 0.25s cubic-bezier(0.4,0,0.2,1) forwards;
  }
  @keyframes slideUp {
    from{opacity:0;transform:translateX(-50%) translateY(16px)}
    to{opacity:1;transform:translateX(-50%) translateY(0)}
  }
  #terminal-window.hidden {
    opacity:0 !important; pointer-events:none !important;
    transform:translateX(-50%) translateY(8px) scale(0.97) !important;
  }
  #terminal-window.fullscreen .dot { opacity:0.3; pointer-events:none; cursor:default; }

  #title-bar {
    display:flex; align-items:center; gap:8px;
    padding:10px 16px;
    background:rgba(17,17,27,0.65);
    border-bottom:1px solid rgba(255,255,255,0.05);
    flex-shrink:0; transition:background 0.4s, border-color 0.4s;
  }
  body.hacked #title-bar { background:rgba(30,0,0,0.75); border-bottom-color:rgba(255,50,50,0.2); }

  .dot { width:12px; height:12px; border-radius:50%; cursor:pointer; transition:opacity 0.2s; }
  .dot:hover { opacity:0.7; }
  .dot-red    { background:#ff5f57; }
  .dot-yellow { background:#ffbd2e; }
  .dot-green  { background:#28c840; }

  #title-text { margin-left:12px; font-size:12px; color:var(--overlay0); font-weight:500; letter-spacing:0.05em; transition:color 0.4s; }

  #terminal-body {
    flex:1 1 0; min-height:0; overflow-y:auto; overflow-x:hidden;
    padding:16px; font-size:13px; line-height:1.6;
    scrollbar-width:thin; scrollbar-color:var(--surface1) transparent;
  }
  #terminal-body::-webkit-scrollbar { width:4px; }
  #terminal-body::-webkit-scrollbar-thumb { background:var(--surface1); border-radius:2px; }

  .line { margin-bottom:2px; white-space:pre-wrap; word-break:break-all; }
  .line-success { color:var(--green); }
  .line-error   { color:var(--red); }
  .line-warning { color:var(--yellow); }
  .line-info    { color:var(--blue); }
  .line-muted   { color:var(--overlay0); }
  .line-mauve   { color:var(--mauve); }
  .line-peach   { color:var(--peach); }
  .line-teal    { color:var(--teal); }
  .line-red     { color:var(--red); }
  .line-blue    { color:var(--blue); }
  .line-hack    { color:#ff2222; font-weight:600; }

  #input-area { display:flex; align-items:center; padding:8px 16px 14px; flex-shrink:0; }
  #prompt-label { color:var(--mauve); font-weight:600; font-size:13px; white-space:nowrap; flex-shrink:0; }
  #cmd-input {
    background:transparent; border:none; outline:none;
    color:var(--text); font-family:'JetBrains Mono',monospace; font-size:13px;
    flex:1; caret-color:var(--green); margin-left:8px; transition:caret-color 0.4s;
  }
  body.hacked #cmd-input { caret-color:#ff3333; }

  /* PROJECT VIEWER */
  #project-viewer {
    position:fixed; inset:0; z-index:50; display:none;
    padding:40px; overflow-y:auto;
    background:rgba(11,11,17,0.72); backdrop-filter:blur(4px);
    opacity:0; transition:opacity 0.4s ease;
  }
  #project-viewer.visible { display:flex; align-items:flex-start; justify-content:center; }
  #project-viewer.faded-in { opacity:1; }
  #project-content { max-width:840px; width:100%; padding-bottom:180px; }

  .project-header { margin-bottom:32px; }
  .project-tag {
    display:inline-block; padding:3px 10px; border-radius:4px;
    font-size:11px; font-weight:600; letter-spacing:0.1em; text-transform:uppercase;
    margin-bottom:16px; margin-right:8px;
  }
  .tag-red    { background:rgba(243,139,168,0.15); color:var(--red);    border:1px solid rgba(243,139,168,0.3); }
  .tag-blue   { background:rgba(137,180,250,0.15); color:var(--blue);   border:1px solid rgba(137,180,250,0.3); }
  .tag-green  { background:rgba(166,227,161,0.15); color:var(--green);  border:1px solid rgba(166,227,161,0.3); }
  .tag-mauve  { background:rgba(203,166,247,0.15); color:var(--mauve);  border:1px solid rgba(203,166,247,0.3); }
  .tag-peach  { background:rgba(250,179,135,0.15); color:var(--peach);  border:1px solid rgba(250,179,135,0.3); }
  .tag-teal   { background:rgba(148,226,213,0.15); color:var(--teal);   border:1px solid rgba(148,226,213,0.3); }
  .tag-yellow { background:rgba(249,226,175,0.15); color:var(--yellow); border:1px solid rgba(249,226,175,0.3); }

  .project-title    { font-size:42px; font-weight:700; color:var(--text); line-height:1.1; margin-bottom:8px; letter-spacing:-0.02em; }
  .project-subtitle { font-size:15px; color:var(--subtext0); margin-bottom:32px; line-height:1.7; }
  .divider { height:1px; background:linear-gradient(90deg,var(--surface1),transparent); margin:24px 0; }
  .section-label { font-size:11px; text-transform:uppercase; letter-spacing:0.15em; color:var(--overlay0); margin-bottom:12px; font-weight:600; }
  .project-desc  { font-size:14px; color:var(--subtext1); line-height:1.85; margin-bottom:24px; }

  .tech-stack { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:28px; }
  .tech-pill {
    padding:5px 14px; border-radius:20px; font-size:12px; font-weight:500;
    background:var(--surface0); color:var(--subtext1); border:1px solid var(--surface1);
    transition:all 0.2s;
  }
  .tech-pill:hover { background:var(--surface1); color:var(--text); border-color:var(--overlay0); }

  .feature-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:28px; }
  .feature-card { background:var(--surface0); border:1px solid var(--surface1); border-radius:8px; padding:16px; transition:border-color 0.2s; }
  .feature-card:hover { border-color:var(--overlay0); }
  .feature-card h4 { font-size:12px; color:var(--mauve); margin-bottom:6px; font-weight:600; }
  .feature-card p  { font-size:12px; color:var(--subtext0); line-height:1.65; }

  .stat-row { display:flex; gap:28px; margin-bottom:24px; flex-wrap:wrap; }
  .stat { text-align:center; }
  .stat-number { font-size:26px; font-weight:700; color:var(--blue); display:block; line-height:1.2; }
  .stat-label  { font-size:11px; color:var(--overlay0); text-transform:uppercase; letter-spacing:0.1em; }

  .exit-hint { display:flex; align-items:center; gap:8px; font-size:11px; color:var(--overlay0); margin-top:8px; flex-wrap:wrap; }
  .exit-hint kbd { background:var(--surface0); border:1px solid var(--surface1); padding:2px 8px; border-radius:4px; color:var(--subtext0); font-family:'JetBrains Mono',monospace; font-size:11px; }

  .ls-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:4px 0; }
  .ls-dir  { color:var(--blue); font-weight:600; }
  .ls-file { color:var(--text); }

  .help-table { width:100%; border-collapse:collapse; }
  .help-table td { padding:3px 12px 3px 0; font-size:13px; }
  .help-table td:first-child { color:var(--green); min-width:180px; }
  .help-table td:last-child  { color:var(--subtext0); }

  /* FAB */
  #terminal-fab {
    display:none; position:fixed; bottom:28px; right:28px; z-index:200;
    align-items:center; gap:10px;
    background:rgba(30,30,46,0.95); border:1px solid rgba(203,166,247,0.35); border-radius:40px;
    padding:10px 18px 10px 14px; cursor:pointer;
    box-shadow:0 4px 24px rgba(0,0,0,0.6),0 0 20px rgba(203,166,247,0.12);
    backdrop-filter:blur(12px); font-family:'JetBrains Mono',monospace;
    font-size:12px; font-weight:600; color:var(--mauve); letter-spacing:0.04em;
    transition:all 0.2s ease; animation:fabPop 0.3s cubic-bezier(0.175,0.885,0.32,1.275) forwards;
  }
  @keyframes fabPop { from{opacity:0;transform:scale(0.8) translateY(8px)} to{opacity:1;transform:scale(1) translateY(0)} }
  #terminal-fab:hover { background:rgba(40,40,60,0.98); border-color:rgba(203,166,247,0.6); transform:translateY(-1px); }
  body.hacked #terminal-fab { border-color:rgba(255,50,50,0.5); color:#ff4444; box-shadow:0 4px 24px rgba(0,0,0,0.6),0 0 24px rgba(255,0,0,0.22); }

  .ascii-art { color:var(--blue); font-size:11px; line-height:1.2; white-space:pre; }

  /* GLITCH / FLICKER for hack mode */
  @keyframes glitch {
    0%  {clip-path:inset(0 0 97% 0);transform:translateX(-7px) skewX(-5deg)}
    12% {clip-path:inset(10% 0 75% 0);transform:translateX(7px)}
    25% {clip-path:inset(40% 0 40% 0);transform:translateX(-4px)}
    50% {clip-path:inset(72% 0 8% 0);transform:translateX(6px) skewX(3deg)}
    100%{clip-path:inset(0);transform:none}
  }
  @keyframes flicker {
    0%,100%{opacity:1} 87%{opacity:1} 88%{opacity:0.15} 89%{opacity:1} 93%{opacity:0.55} 94%{opacity:1}
  }
  body.hacked { animation:flicker 5s infinite; }

  #project-viewer::-webkit-scrollbar { width:4px; }
  #project-viewer::-webkit-scrollbar-thumb { background:var(--surface1); border-radius:2px; }

  /* journey timeline */
  .journey { display:flex; flex-direction:column; margin-bottom:8px; }
  .journey-step { display:flex; gap:16px; position:relative; padding-bottom:20px; }
  .journey-step:last-child { padding-bottom:0; }
  .journey-step:not(:last-child)::after { content:''; position:absolute; left:17px; top:38px; bottom:0; width:1px; background:var(--surface1); }
  .journey-num { width:35px; height:35px; border-radius:50%; background:var(--surface0); border:1px solid var(--surface1); display:flex; align-items:center; justify-content:center; font-size:10px; font-weight:700; color:var(--mauve); font-family:'JetBrains Mono',monospace; flex-shrink:0; }
  .journey-title { font-size:13px; font-weight:600; color:var(--text); margin-bottom:3px; padding-top:6px; }
  .journey-desc  { font-size:12px; color:var(--subtext0); line-height:1.65; }

  /* component table */
  .comp-table-wrap { background:var(--surface0); border:1px solid var(--surface1); border-radius:8px; overflow:hidden; margin-bottom:8px; }
  .comp-table { width:100%; border-collapse:collapse; font-size:12px; }
  .comp-table th { text-align:left; color:var(--overlay0); font-weight:600; letter-spacing:0.1em; text-transform:uppercase; font-size:10px; padding:10px 14px; border-bottom:1px solid var(--surface1); }
  .comp-table td { padding:10px 14px; border-bottom:1px solid var(--surface0); color:var(--subtext1); line-height:1.5; vertical-align:top; }
  .comp-table td:first-child { color:var(--green); font-family:'JetBrains Mono',monospace; font-size:11px; white-space:nowrap; }
  .comp-table td:nth-child(2) { color:var(--peach); font-size:11px; white-space:nowrap; }
  .comp-table tr:last-child td { border-bottom:none; }

  /* mermaid diagram */
  .diagram-wrap { background:var(--mantle); border:1px solid var(--surface1); border-radius:8px; padding:24px 16px; margin-bottom:8px; overflow-x:auto; }
  .diagram-wrap .mermaid { display:flex; justify-content:center; }

  /* markdown-rendered description */
  .project-desc h2 { font-size:15px; font-weight:700; color:var(--text); margin:28px 0 8px; padding-bottom:6px; border-bottom:1px solid var(--surface1); }
  .project-desc h3 { font-size:13px; font-weight:600; color:var(--mauve); margin:20px 0 6px; letter-spacing:0.02em; }
  .project-desc h4 { font-size:12px; font-weight:600; color:var(--blue); margin:14px 0 4px; }
  .project-desc strong { color:var(--text); font-weight:600; }
  .project-desc em { color:var(--subtext0); font-style:italic; }
  .project-desc img { max-width:100%; border-radius:8px; border:1px solid var(--surface1); margin:16px 0; display:block; box-shadow:0 4px 24px rgba(0,0,0,0.4); }
  .project-desc blockquote { border-left:3px solid var(--mauve); padding:10px 16px; margin:16px 0; color:var(--subtext0); background:var(--surface0); border-radius:0 6px 6px 0; font-size:13px; }
  .project-desc code { background:var(--surface0); color:var(--green); padding:2px 7px; border-radius:4px; font-family:'JetBrains Mono',monospace; font-size:11px; border:1px solid var(--surface1); }
  .project-desc pre { background:var(--mantle); border:1px solid var(--surface1); border-radius:8px; padding:16px; overflow-x:auto; margin:16px 0; }
  .project-desc pre code { background:none; border:none; padding:0; color:var(--text); font-size:12px; line-height:1.7; }
  .project-desc ul, .project-desc ol { padding-left:22px; margin:8px 0 12px; color:var(--subtext1); font-size:14px; line-height:1.85; }
  .project-desc li { margin-bottom:3px; }
  .project-desc a { color:var(--blue); text-decoration:none; }
  .project-desc a:hover { text-decoration:underline; }
  .project-desc hr { border:none; border-top:1px solid var(--surface1); margin:28px 0; }
  .project-desc p { margin-bottom:12px; }

  @media(max-width:640px){
    #terminal-window.fullscreen { inset:0; border-radius:0; }
    #project-viewer { padding:20px; }
    .project-title { font-size:26px; }
    .feature-grid  { grid-template-columns:1fr; }
    #terminal-fab  { bottom:20px; right:20px; }
    #terminal-window.overlay { width:calc(100vw - 24px); height:300px; bottom:12px; }
  }
</style>
</head>
<body>

<div id="wallpaper"></div>
<div class="scanline"></div>

<div id="project-viewer">
  <div id="project-content"></div>
</div>

<div id="terminal-window" class="fullscreen">
  <div id="title-bar">
    <div class="dot dot-red"    onclick="closeTerm()"></div>
    <div class="dot dot-yellow" onclick="minimizeTerm()"></div>
    <div class="dot dot-green"  onclick="maximizeTerm()"></div>
    <img src="Gemini_Generated_Image_o2l9n6o2l9n6o2l9.png" style="width:44px;height:44px;object-fit:contain;margin-left:8px;border-radius:6px;opacity:0.95">
    <span id="title-text">vonton@cyber: ~</span>
  </div>
  <div id="terminal-body"></div>
  <div id="input-area">
    <span id="prompt-label">
      <span style="color:var(--mauve);font-weight:700">vonton</span><span style="color:var(--overlay1)">@</span><span style="color:var(--blue)">cyber</span> <span id="path-display" style="color:var(--teal)">~</span><span style="color:var(--green)"> $ </span>
    </span>
    <input type="text" id="cmd-input" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" disabled>
  </div>
</div>

<div id="terminal-fab" onclick="toggleTerminalFab()">
  <span style="font-size:14px;opacity:0.9">&gt;_</span>
  <span>terminal</span>
  <span style="font-size:10px;color:var(--overlay0);font-weight:400;margin-left:4px">` or click</span>
</div>

<script>
mermaid.initialize({
  startOnLoad: false, theme: 'dark',
  themeVariables: {
    darkMode: true, background: '#181825', primaryColor: '#313244',
    primaryTextColor: '#cdd6f4', primaryBorderColor: '#45475a',
    lineColor: '#585b70', secondaryColor: '#1e1e2e', tertiaryColor: '#11111b',
    edgeLabelBackground: '#181825', fontFamily: "'JetBrains Mono', monospace",
  },
  flowchart: { curve: 'basis', htmlLabels: true }
});

// ============================================================
// FILE SYSTEM DATA
// ============================================================

// ASCII arts — randomly picked on each boot
const PANDA_ART = `
   /\\_____/\\        
  /  o   o  \\       
 ( ==  ^  == )      
  )         (       
 (           )      
 ((__) _ (__))    
    `;

const ARTS = [PANDA_ART];
const GHOST_ART = ARTS[Math.floor(Math.random() * ARTS.length)];

const FILE_SYSTEM = {
  '~': {
    type: 'dir',
    children: {

      // ── PROJECTS ────────────────────────────────────────────
      'projects': {
        type: 'dir',
        children: {

          'cve-vuln-exploiter': {
            type: 'file',
            data: {
              title: 'Automated CVE Exploiter',
              subtitle: 'Autonomous agentic system achieving 86% Docker build success across 400+ CVEs',
              tags: [
                { label: 'Research', cls: 'tag-red' },
                { label: 'C++ / Python', cls: 'tag-peach' },
                { label: 'LangGraph', cls: 'tag-mauve' },
                { label: 'Active', cls: 'tag-green' },
              ],
              description: `## Executive Summary
An autonomous agent that ingests CVE specifications and automatically sets up Docker exploit environments to simulate vulnerability reproduction. Built at the **SFU Cybersecurity & AI Research Lab**, it improved Docker build success from **51% to 86%** across 400+ CVEs and was proposed to **Trend Micro** for zero-day to n-day lifecycle acceleration.

A high-performance hash cracking suite in **C++23** — MD5, SHA1, SHA256, and SHA512. Three attack vectors: dictionary, brute-force, and rule-based mutation. Engineered for **linear throughput scaling** with zero synchronization overhead on the hot path.

## The Engineering Problem
Most hash crackers are I/O-bound or synchronization-bound. Either they spend cycles copying wordlist data into heap buffers, or worker threads stall on mutexes competing for work. Both kill throughput at scale.

## The Solution
Two decisions eliminate both bottlenecks:

**Zero-copy ingestion via \`mmap\`:** The wordlist is mapped directly into the process address space — no heap copy, no read syscalls on the hot path. Workers read directly from the mapped region.

**Lock-free work partitioning:** Workers claim chunks via \`std::atomic\` — a single atomic increment, no mutex, no contention. Each \`std::jthread\` works independently until its chunk is exhausted, then atomically claims another.

> The result: throughput scales **linearly with core count**. Adding cores gives proportional gains because there is nothing to contend on.

## Attack Modes

### Dictionary Attack
Iterates a known password wordlist using mmap zero-copy loading. Fast for common passwords covered by standard lists like rockyou.

### Brute Force Enumeration
Generates all combinations for a given charset and length range — exhaustive, effective for short unknown passwords.

### Rule-Based Mutation
Applies transformation rules to dictionary entries: **leet substitutions** (a→@, e→3), **suffix/prefix appending** (password1, 2025password), and **case toggling** (Password, PASSWORD).`,

              description: `## Executive Summary
A privacy-compliant mobile communication platform **deployed to production with real users**. Built with React Native, Firebase for real-time sync, and a server-side RBAC model enforced entirely through Firestore security rules — no client-side trust.

## Security Architecture

### Server-Side RBAC (No Client Trust)
All access control is enforced in **Firestore security rules** — not in the client app. This is a critical distinction:

- Client-side permission checks can be bypassed by modifying the app
- Firestore rules run on Google's infrastructure and **cannot be bypassed by a client**

Users are assigned roles at the organisation level. Firestore rules evaluate the role claim on every read/write operation before allowing it through.

### Cryptographic Credential Security
User credentials use **cryptographic hashing and salting** — passwords are never stored in plaintext. Salt prevents rainbow table attacks even if the database is exfiltrated.

### Privacy-First Design
Privacy compliance was a first-class requirement from day one, not bolted on after:
- **Data minimisation** — only necessary fields stored per user
- **Access logging** — audit trail for privileged operations
- **Role-gated visibility** — users only see records their role permits

> The difference between a prototype and a production app is the security architecture. This was built production-first.`,

A full-stack university carpooling platform with a **9-table BCNF-normalized MySQL database**, raw SQL queries (no ORM), Bcrypt credential security, server-side RBAC, and an integrated **Anthropic Claude chatbot** for AI-powered ride recommendations.

## Database Design: Why No ORM?
The database was designed and normalized to **Boyce-Codd Normal Form** across 9 tables using raw SQL — a deliberate choice. ORMs abstract away the relational model. Building without one demonstrates direct understanding of:

- **Join strategies** — choosing between approaches based on table cardinality
- **Index design** — indexing the right columns for this app's query patterns
- **BCNF normalization** — eliminating all functional dependency anomalies across 9 interrelated tables

### Schema Highlights
- **Rides** — origin, destination, departure time, available seats, driver FK
- **Bookings** — passenger FK, ride FK, status (pending / confirmed / cancelled)
- **Ratings** — bidirectional driver/passenger ratings post-ride
- **Users** — role-based (driver/passenger), Bcrypt-hashed credentials

## Security Architecture
- **Bcrypt (12 rounds)** — ~300ms hash time: fast enough for UX, slow enough to defeat brute-force
- **Parameterized queries** — all SQL uses pymysql parameterization, preventing injection
- **Server-side RBAC** — role decisions enforced in backend handlers, not the client

## AI Integration
Integrated **Anthropic Claude** for intelligent ride recommendations — accepts natural language queries, matches them against available rides, and returns ranked results with reasoning.`,

function getDirAtPath(path) {
  let node=FILE_SYSTEM['~'];
  if(path.length===1) return node.children;
  for(let i=1;i<path.length;i++){

  }

}

const ALL_CMDS=['ls','cd','cat','whoami','sudo','clear','help','pwd','uname','exit','echo','man','hack','date','uptime'];

function lev(a,b){
  const m=a.length,n=b.length,dp=Array.from({length:m+1},(_,i)=>[i,...Array(n).fill(0)]);
  for(let j=0;j<=n;j++)dp[0][j]=j;
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)dp[i][j]=a[i-1]===b[j-1]?dp[i-1][j-1]:1+Math.min(dp[i-1][j],dp[i][j-1],dp[i-1][j-1]);
  return dp[m][n];
}
function closest(cmd){let b=null,bd=Infinity;for(const c of ALL_CMDS){const d=lev(cmd,c);if(d<bd){bd=d;b=c;}}return bd<=3?b:null;}

function handleCommand(raw) {
  if(hackBusy) return;
  const trimmed=raw.trim(); if(!trimmed) return;
  appendPromptLine(trimmed); cmdHistory.unshift(trimmed); historyIdx=-1;
  const parts=trimmed.split(/\s+/), cmd=parts[0].toLowerCase(), args=parts.slice(1);
  switch(cmd) {
    case 'help':   cmdHelp();   break;
    case 'ls':     cmdLs();    break;
    case 'pwd':    appendLine(getPathStr(),'line-teal'); break;
    case 'cd':     cmdCd(args[0]); break;
    case 'cat':    cmdCat(args[0]); break;
    case 'clear':  body.innerHTML=''; break;
    case 'whoami': appendLine('vonton — security researcher & cs student @ sfu','line-success'); break;
    case 'uname':  appendLine('Linux cyber 6.1.0-security-custom #1 SMP x86_64 GNU/Linux','line-info'); break;
    case 'echo':   appendLine(args.join(' ')); break;
    case 'date':   appendLine(new Date().toString(),'line-teal'); break;
    case 'uptime': appendLine('up 42 days, 7 hours — no downtime on the grind','line-teal'); break;
    case 'sudo':   appendLine('sudo: students don\'t get root. nice try.','line-error'); break;
    case 'man':    if(!args[0]){appendLine('What manual page do you want?','line-warning');break;} appendLine(`No manual entry for ${args[0]}. Try 'help'.`,'line-error'); break;
    case 'exit':   viewMode?exitViewMode():appendLine('Cannot exit: this terminal is your life now.','line-warning'); break;
    case 'hack':   runHack(); break;
    default: {
      const s=closest(cmd);
      if(s) appendHTML(`<span style="color:var(--red)">bash: ${esc(cmd)}: command not found.</span> <span style="color:var(--overlay0)">Did you mean </span><span style="color:var(--yellow)">${s}</span><span style="color:var(--overlay0)">?</span>`);
      else appendLine(`bash: ${cmd}: command not found`,'line-error');
    }
  }
  appendLine(''); body.scrollTop=body.scrollHeight;
}

function cmdLs() {
  const dir=getDirAtPath(currentPath);
  if(!dir){appendLine('ls: cannot access directory','line-error');return;}
  const entries=Object.entries(dir);
  if(!entries.length){appendLine('(empty)','line-muted');return;}
  const wrap=document.createElement('div');
  wrap.className='line';
  wrap.style.cssText='display:flex;flex-direction:column;gap:3px;margin:2px 0';
  entries.forEach(([name,node])=>{
    const row=document.createElement('div');
    row.style.cssText='display:flex;align-items:baseline;gap:16px';
    if(node.type==='dir'){
      const count=Object.keys(node.children||{}).length;
      row.innerHTML=`<span class="ls-dir" style="min-width:220px">${name}/</span><span style="color:var(--overlay0);font-size:11px">${count} item${count!==1?'s':''}</span>`;
    } else {

      row.innerHTML=`<span class="ls-file" style="min-width:220px">${name}</span><span style="color:var(--overlay0);font-size:11px">${short}</span>`;
    }
    wrap.appendChild(row);

function showDirBanner(path) {

  const desc=DIR_DESC[dirName]||'';
  const label=path.length===1?'~':dirName+'/';

function cmdCd(target) {
  if(!target||target==='~'){currentPath=['~'];updatePrompt();showDirBanner(currentPath);cmdLs();return;}
  const segs=target.split('/').filter(s=>s!=='');
  let newPath=target.startsWith('~')?['~']:[...currentPath];
  for(const seg of segs){
    if(seg==='~')newPath=['~'];
    else if(seg==='..'){if(newPath.length>1)newPath.pop();else{appendLine('Already at root.','line-warning');return;}}
    else if(seg==='.'){}
    else{
      const dir=getDirAtPath(newPath);
      if(!dir||!dir[seg]){appendLine(`cd: ${seg}: No such file or directory`,'line-error');return;}
      if(dir[seg].type!=='dir'){appendLine(`cd: ${seg}: Not a directory`,'line-error');return;}
      newPath.push(seg);
    }
  }
  currentPath=newPath; updatePrompt(); showDirBanner(currentPath); cmdLs();
}

function cmdCat(filename) {
  if(!filename){appendLine('Usage: cat [filename]','line-warning');return;}
  const dir=getDirAtPath(currentPath);
  if(!dir){appendLine(`cat: ${filename}: No such file or directory`,'line-error');return;}
  const node=dir[filename];
  if(!node){appendLine(`cat: ${filename}: No such file or directory`,'line-error');return;}
  if(node.type==='dir'){appendLine(`cat: ${filename}: Is a directory`,'line-error');return;}
  appendLine(`Opening ${filename}...`,'line-muted');
  setTimeout(()=>enterViewMode(node.data),300);
}

  appendLine('  [RESTORE] Executing recovery playbook...','line-success'); await wait(240);
  appendLine('  [OK] Backdoor processes terminated and cleaned','line-success'); await wait(180);
  appendLine('  [OK] Rootkit kernel module unloaded','line-success'); await wait(180);
  appendLine('  [OK] iptables rules restored from backup snapshot','line-success'); await wait(180);
  appendLine('  [OK] C2 beacon severed — connection closed','line-success'); await wait(180);
  appendLine('  [OK] Compromised credentials rotated','line-success'); await wait(180);
  appendLine('  [OK] IOCs shared to threat intelligence platform','line-success'); await wait(240);
  appendLine('  [OK] Post-incident report template generated','line-success'); await wait(200);
  appendLine('  All systems nominal. Lessons learned documented. Good work.','line-muted');
  appendLine('','');

  hacked=false;
  document.body.classList.remove('hacked');
  titleEl.textContent=`vonton@cyber: ${getPathStr()}`;
  titleEl.style.color='';
  hackBusy=false; input.disabled=false; input.focus();
}

// ============================================================
// VIEW MODE
// ============================================================
function enterViewMode(data) {
  viewMode=true;
  const viewer=document.getElementById('project-viewer'),content=document.getElementById('project-content');
  content.innerHTML=buildHTML(data);
  viewer.style.display='flex';
  requestAnimationFrame(()=>viewer.classList.add('faded-in'));
  const diagNodes=content.querySelectorAll('.mermaid');
  if(diagNodes.length) mermaid.run({ nodes: diagNodes });
  const term=document.getElementById('terminal-window');
  term.classList.remove('fullscreen','minimized','overlay'); term.classList.add('hidden');
  termVisible=false; input.disabled=true; input.value=''; input.blur();
  document.getElementById('terminal-fab').style.display='flex';
}

function exitViewMode() {
  viewMode=false;
  const viewer=document.getElementById('project-viewer');
  viewer.classList.remove('faded-in');
  setTimeout(()=>{viewer.style.display='none';},400);
  const term=document.getElementById('terminal-window');
  term.classList.remove('hidden','minimized','overlay'); term.classList.add('fullscreen');
  termVisible=true; input.disabled=false;
  document.getElementById('terminal-fab').style.display='none';
  appendLine('Exited view mode.','line-muted'); appendLine('');
  input.focus();
}

const ICON_MAP={
  'python':'python','c++':'cpp','c++23':'cpp','c / c++':'cpp','c':'c',
  'javascript':'js','typescript':'ts','java':'java','docker':'docker',
  'react':'react','react native':'react','firebase':'firebase',
  'azure':'azure','microsoft azure':'azure','ubuntu':'ubuntu',
  'linux':'linux','kali linux':'kali','git':'git','powershell':'powershell',
  'flask':'flask','bash':'bash','std::jthread':'cpp','std::atomic':'cpp',
};

function getSkillIcons(techList) {
  const icons=[...new Set(techList.map(t=>ICON_MAP[t.toLowerCase()]).filter(Boolean))].slice(0,8);
  return icons.length?icons.join(','):null;
}

function buildHero(d) {
  if(d.image) return `<div style="border-radius:12px;overflow:hidden;margin-bottom:28px;border:1px solid var(--surface1)"><img src="${d.image}" style="width:100%;display:block;max-height:300px;object-fit:cover" alt="preview"></div>`;
  const icons=getSkillIcons(d.tech||[]);
  const iconsHTML=icons?`<img src="https://skillicons.dev/icons?i=${icons}&theme=dark" style="height:42px;opacity:0.9;margin-top:14px" alt="tech stack">`:'';
  const grads={'tag-red':'135deg,#2a1520,#3d1a25','tag-blue':'135deg,#151a2e,#1a2540','tag-green':'135deg,#152520,#1a3025','tag-mauve':'135deg,#1f1528,#2a1a3d','tag-peach':'135deg,#281e15,#3d2a18','tag-teal':'135deg,#152525,#1a3535','tag-yellow':'135deg,#252215,#3d3418'};
  const grad=grads[d.tags?.[0]?.cls]||grads['tag-blue'];
  return `
    <div style="border-radius:12px;margin-bottom:28px;border:1px solid var(--surface1);overflow:hidden;background:linear-gradient(${grad});padding:28px 32px;position:relative">
      <div style="position:absolute;inset:0;opacity:0.035;background:repeating-linear-gradient(45deg,#fff 0,#fff 1px,transparent 0,transparent 50%) 0 0/6px 6px"></div>
      <div style="position:relative">
        <div style="font-size:10px;color:var(--overlay0);letter-spacing:0.12em;text-transform:uppercase;font-family:'JetBrains Mono',monospace">// tech stack</div>
        <div style="font-size:17px;font-weight:700;color:var(--text);margin-top:6px">${esc(d.title)}</div>
        ${iconsHTML}
      </div>
    </div>`;
}

function buildHTML(d) {
  const tags  = d.tags.map(t=>`<span class="project-tag ${t.cls}">${t.label}</span>`).join('');
  const feats = d.features.map(f=>`<div class="feature-card"><h4>${f.title}</h4><p>${f.desc}</p></div>`).join('');
  const tech  = d.tech.map(t=>`<span class="tech-pill">${t}</span>`).join('');
  const stats = d.stats.map(s=>`<div class="stat"><span class="stat-number">${s.n}</span><span class="stat-label">${s.l}</span></div>`).join('');
  return `
    ${buildHero(d)}
    <div class="project-header">
      <div>${tags}</div>
      <h1 class="project-title">${d.title}</h1>
      <p class="project-subtitle">${d.subtitle}</p>
      <div class="exit-hint">Press <kbd>&gt;_ terminal</kbd> to toggle &nbsp;·&nbsp; type <kbd>exit</kbd> to go back</div>
    </div>
    <div class="divider"></div>
    <div class="section-label">// overview</div>
    <div class="project-desc">${marked.parse(d.description)}</div>
    ${d.stats.length?`<div class="stat-row">${stats}</div><div class="divider"></div>`:''}
    ${d.steps&&d.steps.length?`
      <div class="section-label">// approach</div>
      <div class="journey">${d.steps.map(s=>`
        <div class="journey-step">
          <div class="journey-num">${s.n}</div>
          <div><div class="journey-title">${esc(s.title)}</div><div class="journey-desc">${esc(s.desc)}</div></div>
        </div>`).join('')}
      </div><div class="divider"></div>`:''}
    ${d.table?`
      <div class="section-label">// components</div>
      <div class="comp-table-wrap"><table class="comp-table">
        <thead><tr>${d.table.headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead>
        <tbody>${d.table.rows.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody>
      </table></div><div class="divider"></div>`:''}
    ${d.diagram?`
      <div class="section-label">// architecture</div>
      <div class="diagram-wrap"><div class="mermaid">${d.diagram}</div></div>
      <div class="divider"></div>`:''}
    ${d.tech.length?`<div class="section-label">// tech stack</div><div class="tech-stack">${tech}</div>`:''}
    ${d.features.length?`<div class="section-label">// details</div><div class="feature-grid">${feats}</div>`:''}
    <div class="divider" style="margin-top:40px"></div>
    <div style="display:flex;align-items:center;gap:12px;padding:16px 0 8px;color:var(--overlay0);font-size:11px;letter-spacing:0.08em">
      <span>── EOF</span>
      <span style="flex:1;height:1px;background:var(--surface0);display:inline-block"></span>
      <span style="color:var(--surface2)">type <span style="color:var(--overlay0)">exit</span> to go back</span>
    </div>`;
}

// ============================================================
// TERMINAL CONTROLS
// ============================================================
function closeTerm() {
  const t=document.getElementById('terminal-window');
  t.classList.add('hidden'); termVisible=false;
  input.disabled=true; input.value=''; input.blur();
}
function minimizeTerm() { if(viewMode) toggleTerminalFab(); }
function maximizeTerm() {
  const t=document.getElementById('terminal-window');
  t.classList.remove('minimized','hidden'); t.classList.add('fullscreen');
  termVisible=true; input.disabled=false;
  if(viewMode) exitViewMode(); input.focus();
}

function toggleTerminalFab() {
  const term=document.getElementById('terminal-window');
  termVisible=!termVisible;
  if(termVisible){
    input.disabled=false;
    term.classList.remove('fullscreen','minimized'); term.classList.add('overlay');
    void term.offsetWidth; term.classList.remove('hidden');
    setTimeout(()=>{
      body.scrollTop=body.scrollHeight;
      if(body.innerHTML===''){currentPath=['~'];updatePrompt();runBoot();}
      else input.focus();
    },50);
  } else {
    input.disabled=true; input.value=''; input.blur(); term.classList.add('hidden');
  }
}

// ============================================================
// INPUT
// ============================================================
input.addEventListener('keydown', e=>{
  if(!termVisible||input.disabled){e.preventDefault();return;}
  if(e.key==='Enter'){const v=input.value;input.value='';handleCommand(v);}
  else if(e.key==='ArrowUp'){e.preventDefault();if(historyIdx<cmdHistory.length-1){historyIdx++;input.value=cmdHistory[historyIdx];setTimeout(()=>{input.selectionStart=input.selectionEnd=input.value.length;},0);}}
  else if(e.key==='ArrowDown'){e.preventDefault();if(historyIdx>0){historyIdx--;input.value=cmdHistory[historyIdx];}else{historyIdx=-1;input.value='';}}
  else if(e.key==='Tab'){e.preventDefault();autocomplete();}
  else if(e.key==='l'&&e.ctrlKey){e.preventDefault();body.innerHTML='';}
  else if(e.key==='c'&&e.ctrlKey){e.preventDefault();appendPromptLine(input.value+'^C');input.value='';appendLine('');}
});

function autocomplete(){
  const val=input.value,parts=val.trim().split(/\s+/);
  if(parts.length===1){
    const partial=parts[0],matches=ALL_CMDS.filter(c=>c.startsWith(partial));
    if(matches.length===1)input.value=matches[0]+' ';
    else if(matches.length>1){appendPromptLine(val);appendLine(matches.join('  '),'line-muted');}
  } else if(parts.length===2){
    const partial=parts[1],dir=getDirAtPath(currentPath);
    if(!dir)return;
    const matches=Object.keys(dir).filter(k=>k.startsWith(partial));
    if(matches.length===1)input.value=parts[0]+' '+matches[0];
    else if(matches.length>1){appendPromptLine(val);appendLine(matches.join('  '),'line-muted');}
  }
}

document.addEventListener('click',()=>{if(termVisible&&!input.disabled)input.focus();});
document.addEventListener('keydown',e=>{
  if(e.key==='`'&&viewMode){e.preventDefault();toggleTerminalFab();return;}
  if(!termVisible)return;
  if(e.target!==input&&!e.ctrlKey&&!e.metaKey&&e.key.length===1)input.focus();
});

// ============================================================
// INIT
// ============================================================
runBoot();
</script>
